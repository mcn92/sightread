  "explanations": {
    "novice": {
      "body": "Loops over a collection while also counting: each pass gives you the position and the item together.",
      "example": {
        "code": "for i, letter in enumerate(\"abc\"):\n    print(i, letter)",
        "expected_output": null
      },
      "gotcha": "Each element is a pair — unpack it as \"for i, item in ...\" or you'll get tuples."
    },
    "learning": {
      "body": "Wraps an iterable to yield (index, item) pairs — the Pythonic replacement for looping over range(len(x)). start= sets the first index.",
      "example": {
        "code": "for i, letter in enumerate(\"abc\"):\n    print(i, letter)",
        "expected_output": null
      },
      "gotcha": "Each element is a pair — unpack it as \"for i, item in ...\" or you'll get tuples."
    },
