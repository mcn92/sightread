  "explanations": {
    "novice": {
      "body": "Tells you how many items something holds — characters in a string, elements in a list, keys in a dictionary.",
      "example": {
        "code": "print(len(\"hello\"))   # 5",
        "expected_output": null
      },
      "gotcha": "len works on containers, not numbers — len(42) is a TypeError."
    },
    "learning": {
      "body": "Returns the item count of any sized container. It's a function, not a method: len(x), never x.len().",
      "example": {
        "code": "print(len(\"hello\"))   # 5",
        "expected_output": null
      },
      "gotcha": "len works on containers, not numbers — len(42) is a TypeError."
    },
    "comfortable": {
      "body": "Dispatches to __len__; O(1) for all built-in containers.",
      "example": {
        "code": "print(len(\"hello\"))   # 5",
        "expected_output": null
      },
      "gotcha": "len works on containers, not numbers — len(42) is a TypeError."
    }
