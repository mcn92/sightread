  "explanations": {
    "novice": {
      "body": "Opens a file so your program can read or write it. Almost always used with \"with\", which closes the file for you.",
      "example": {
        "code": "with open(\"notes.txt\") as f:\n    print(f.read())",
        "expected_output": null
      },
      "gotcha": "Mode \"w\" truncates the file the moment it opens — before you've written anything."
    },
    "learning": {
      "body": "Returns a file object; the mode string picks reading (\"r\"), writing (\"w\" — erases!), or appending (\"a\"). Pair with with for guaranteed cleanup.",
      "example": {
        "code": "with open(\"notes.txt\") as f:\n    print(f.read())",
        "expected_output": null
      },
      "gotcha": "Mode \"w\" truncates the file the moment it opens — before you've written anything."
    },
    "comfortable": {
      "body": "Text mode decodes via encoding= (pass it explicitly; the default is platform-dependent pre-3.15); \"b\" modes yield bytes.",
      "example": {
        "code": "with open(\"notes.txt\") as f:\n    print(f.read())",
        "expected_output": null
      },
      "gotcha": "Mode \"w\" truncates the file the moment it opens — before you've written anything."
    }
  },
