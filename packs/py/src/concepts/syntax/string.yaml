  "explanations": {
    "novice": {
      "body": "Text in quotes. Single and double quotes mean the same thing; triple quotes let the text span multiple lines.",
      "example": {
        "code": "message = \"hello\"\npoem = \"\"\"roses are red,\nviolets are blue\"\"\"",
        "expected_output": null
      },
      "gotcha": "Strings can't be changed in place — every \"modification\" builds a new string."
    },
    "learning": {
