  "explanations": {
    "novice": {
      "body": "Gives the remainder after division: 7 % 2 is 1. Handy for \"is this number even?\" — n % 2 == 0.",
      "example": {
        "code": "print(7 % 2)   # 1\nprint(8 % 2)   # 0  (even)",
        "expected_output": null
      },
      "gotcha": "Sign follows the divisor: -7 % 3 is 2, not -1 — different from many other languages."
    },
    "learning": {
      "body": "Remainder operator; the result takes the sign of the divisor, so -7 % 3 is 2 in Python. Common for wrapping indexes and even/odd checks.",
      "example": {
        "code": "print(7 % 2)   # 1\nprint(8 % 2)   # 0  (even)",
        "expected_output": null
