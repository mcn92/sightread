  "explanations": {
    "novice": {
      "body": "One equals sign stores the value on the right under the name on the left. It's an action, not a question — the question version is ==.",
      "example": {
        "code": "age = 21\nage = age + 1  # now 22",
        "expected_output": null
      },
      "gotcha": "Assigning a list to a second name doesn't copy it — both names point at the same list."
    },
